# 인프라 파트(infra/) CI. 루트 .gitlab-ci.yml 에서 아래처럼 포함해 사용한다.
#
#   include:
#     - local: infra/.gitlab-ci.yml
#
# 파트별 CI 는 각 파트 디렉터리가 소유한다 (ADR-0002).

infra:env-contract:
  image: python:3.12-alpine
  # 계약(application.yaml)이나 주입(docker-compose.yml)이 바뀔 때만 돈다.
  # 스크립트 자신의 변경에도 반응해야 파서를 고치다 깨뜨린 것을 잡는다.
  rules:
    - changes:
        - backend/src/main/resources/application*.yaml
        - infra/docker-compose.yml
        - infra/scripts/check-env-contract.py
  script:
    - python3 infra/scripts/check-env-contract.py
