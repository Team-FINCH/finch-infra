# 인프라 파트(infra/) CI. 루트 .gitlab-ci.yml 에서 아래처럼 포함해 사용한다.
#
#   include:
#     - local: infra/.gitlab-ci.yml
#
# 파트별 CI 는 각 파트 디렉터리가 소유한다 (ADR-0002).

infra:env-contract:
  image: python:3.12-alpine
  # 계약(application.yaml)이나 주입(docker-compose.yml)이 바뀔 때만 돈다.
  # 스크립트 자신의 변경에도 반응해야 파서를 고치다 깨뜨린 것을 잡는다.
  rules:
    - changes:
        paths:
          - backend/src/main/resources/application*.yaml
          - infra/docker-compose.yml
          - infra/scripts/check-env-contract.py
        compare_to: master
  script:
    - python3 infra/scripts/check-env-contract.py

infra:ai-keys-verify:
  image: alpine:3.20
  # AI 적재기가 쓰는 외부 API 키 4종이 유효한지 확인한다 (FINCH-179).
  # 적재 코드는 키가 틀려도 그 종목을 건너뛰고 '0건 적재' 로 끝나므로
  # (ai/app/rag/dart.py:121), 키 문제와 데이터 없음이 구분되지 않는다.
  #
  # 외부 API 를 실제로 호출하므로 매 푸시마다 돌리지 않는다. 스크립트가
  # 바뀔 때와 스케줄, 그리고 수동 실행에만 돈다.
  #
  # 키는 Protected 변수라 master 파이프라인에서만 실제 값이 들어온다.
  # 작업 브랜치에서는 스크립트가 '판정 불가' 로 끝난다.
  rules:
    - changes:
        paths:
          - infra/scripts/verify-ai-keys.sh
          - infra/.gitlab-ci.yml
        compare_to: master
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl
  script:
    - sh infra/scripts/verify-ai-keys.sh

infra:k8s-chart-lint:
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  # infra/k8s/ 에 CI 검사가 없어서 차트 세 건이 검사 없이 머지됐다 (FINCH-206).
  # helm lint·template 과 셸 문법을 손으로 돌려 확인했는데, 손으로 한 확인은 남지 않는다.
  #
  # FINCH-135 로 Jenkins 배포가 helm 으로 바뀌면 잘못된 차트가 곧 배포 실패가 된다.
  # 그 전에 막아 둔다.
  rules:
    - changes:
        paths:
          - infra/k8s/**/*
          - infra/.gitlab-ci.yml
        compare_to: master
  script:
    - |
      set -e
      for c in infra/k8s/charts/*/; do
        echo "── $c ──"
        helm lint "$c"
        # lint 는 값 없이도 통과하는 오류를 놓친다. template 이 실제 렌더까지 돌려
        # 잘못된 함수·들여쓰기·존재하지 않는 값 참조를 잡는다.
        helm template "$(basename "$c")" "$c" > /dev/null
      done

infra:shell-lint:
  image: alpine:3.21
  # 셸 문법 검사가 infra/k8s 만 보고 있었다. cron 이 root 로 돌리는 infra/scripts/ 는
  # 검사 대상 밖이라, 그쪽만 고친 커밋은 문법 오류가 있어도 파이프라인이 통과한다
  # (FINCH-179 에서 적재 배치를 넣으며 발견). 두 경로를 함께 본다.
  rules:
    - changes:
        paths:
          - infra/scripts/**/*
          - infra/k8s/**/*
          - infra/.gitlab-ci.yml
        compare_to: master
  script:
    - apk add --no-cache bash > /dev/null
    - |
      set -e
      # 서버에서 root 로 도는 스크립트라 문법 오류의 비용이 크다.
      # 셸체크까지는 안 가고 파서 검사만 한다.
      found=0
      for s in $(find infra/scripts infra/k8s -name '*.sh'); do
        # 셰방이 bash 면 bash 로 파싱한다. dash 로 검사하면 local·pipefail 같은
        # bash 전용 문법을 오류로 잡아 멀쩡한 스크립트가 떨어진다.
        if head -1 "$s" | grep -q bash; then
          bash -n "$s"
        else
          sh -n "$s"
        fi
        echo "  문법 OK  $s"
        found=$((found + 1))
      done
      # 대상이 0개면 find 경로가 바뀐 것이다. 조용히 통과시키면 검사가 죽은 것을 모른다.
      if [ "$found" -eq 0 ]; then
        echo "✗ 검사한 스크립트가 0개다. find 경로를 확인할 것" >&2
        exit 1
      fi
      echo "▶ 셸 스크립트 $found 개 검사"

infra:k8s-prom-lint:
  image:
    name: prom/prometheus:v3.1.0
    entrypoint: [""]
  rules:
    - changes:
        paths:
          - infra/k8s/charts/finch-observability/files/prometheus.yml
          - infra/.gitlab-ci.yml
        compare_to: master
  script:
    - |
      set -e
      SRC=infra/k8s/charts/finch-observability/files/prometheus.yml
      SA="$CI_PROJECT_DIR/.sa"
      OUT="$CI_PROJECT_DIR/.prometheus-lint.yml"

      # promtool 은 authorization.credentials_file 의 존재까지 확인한다. 그 경로는
      # 파드 안에만 있는 서비스어카운트 토큰이라 CI 에는 없고, 없으면 "파일이 없다" 로
      # 실패해서 설정 오류와 구별되지 않는다.
      #
      # 더미를 그 경로에 만들 수는 없다. prom/prometheus 이미지는 nobody(65534)로 돌아
      # /var/run/secrets 에 쓰기 권한이 없다 (CI 에서 실측: Permission denied).
      # 그래서 쓰기 가능한 곳에 더미를 만들고 설정 사본의 경로만 그쪽으로 돌린다.
      mkdir -p "$SA"
      echo dummy > "$SA/token"
      echo dummy > "$SA/ca.crt"
      sed "s#/var/run/secrets/kubernetes.io/serviceaccount#$SA#g" "$SRC" > "$OUT"

      # 치환이 실제로 됐는지 판정한다. 경로가 바뀌어 sed 가 헛돌면 promtool 이
      # "파일 없음" 으로 실패하는데, 그 실패가 설정 오류처럼 보인다.
      if grep -q '/var/run/secrets' "$OUT"; then
        echo "✗ 서비스어카운트 경로 치환에 실패했다. sed 패턴을 확인할 것" >&2
        exit 1
      fi

      # 검사 대상은 경로만 바꾼 사본이다. 나머지 구조와 키는 원본과 같다.
      promtool check config "$OUT"

# 아래 셋은 "돌 job 이 없어 파이프라인이 skipped 로 찍히던 경로" 를 덮는다 (FINCH-135).
#
# skipped 자체는 정확한 보고인데 리뷰어에게는 "아무것도 검증 안 됨" 과 구별되지 않고,
# 실제로 검증되지 않은 경우가 있었다 — infra/k8s 가 그랬고(FINCH-206) compose 파일,
# Dockerfile, Jenkinsfile 이 아직 그 상태였다.
#
# 경로만 기존 job 의 changes 에 얹으면 무관한 검사가 초록으로 도는 꼴이라, 그 경로에
# 실제로 무는 검사를 새로 만든다.

infra:compose-validate:
  image: docker:27-cli
  # docker compose config 는 데몬이 필요 없다 — 파싱과 변수 치환만 한다.
  # .env 를 .env.example 로 만들어 렌더하므로 **example 이 렌더에 충분한지**까지 검사된다.
  # ${VAR:?...} 를 새로 넣고 .env.example 에 적는 것을 잊으면 여기서 걸린다.
  rules:
    - changes:
        paths:
          - infra/docker-compose*.yml
          - infra/.env.example
          - infra/.gitlab-ci.yml
        compare_to: master
  script:
    - |
      set -e
      cp infra/.env.example infra/.env
      found=0
      for f in infra/docker-compose*.yml; do
        # external 네트워크는 런타임에만 확인되므로 config 는 그대로 통과한다.
        docker compose -f "$f" --env-file infra/.env config > /dev/null
        echo "  렌더 OK  $f"
        found=$((found + 1))
      done
      if [ "$found" -eq 0 ]; then
        echo "✗ 검사한 compose 파일이 0개다. 경로를 확인할 것" >&2
        exit 1
      fi
      echo "▶ compose 파일 $found 개 검사"

infra:dockerfile-lint:
  image: docker:27-cli
  # buildx 의 내장 검사다. 도구를 새로 들이지 않고 FROM·ENV·복사 규칙 등을 본다.
  # 데몬이 필요해 러너의 docker.sock 을 쓴다 (config.toml 이 이미 마운트한다).
  rules:
    - changes:
        paths:
          - infra/docker/**/*
          - infra/.gitlab-ci.yml
        compare_to: master
  script:
    - |
      set -e
      found=0
      for d in infra/docker/*.Dockerfile; do
        docker buildx build --check -f "$d" . > /dev/null
        echo "  검사 OK  $d"
        found=$((found + 1))
      done
      if [ "$found" -eq 0 ]; then
        echo "✗ 검사한 Dockerfile 이 0개다. 경로를 확인할 것" >&2
        exit 1
      fi
      echo "▶ Dockerfile $found 개 검사"

infra:jenkinsfile-lint:
  image: groovy:4-jdk21
  # Jenkinsfile 을 검사하는 job 이 없었다. 문법 오류가 머지되면 전 파트의 배포가 멈추는데
  # 확인 수단이 "머지하고 다음 배포를 기다린다" 뿐이었다.
  #
  # Jenkins 의 선언형 linter 는 로그인이 필요해 CI 에서 쓸 수 없다(익명은 403). 대신
  # Groovy 파서로 읽는다 — 선언형 파이프라인도 문법상 유효한 Groovy 라 괄호·문자열·
  # 블록 오류가 잡힌다. 스텝 이름이나 인자가 맞는지는 여기서 알 수 없다. 그건 Jenkins 만 안다.
  rules:
    - changes:
        paths:
          - Jenkinsfile
          - infra/.gitlab-ci.yml
        compare_to: master
  script:
    - groovy -e "new GroovyShell().parse(new File('Jenkinsfile')); println '파싱 통과'"
