# 인프라 파트(infra/) CI. 루트 .gitlab-ci.yml 에서 아래처럼 포함해 사용한다.
#
#   include:
#     - local: infra/.gitlab-ci.yml
#
# 파트별 CI 는 각 파트 디렉터리가 소유한다 (ADR-0002).

infra:env-contract:
  image: python:3.12-alpine
  # 계약(application.yaml)이나 주입(docker-compose.yml)이 바뀔 때만 돈다.
  # 스크립트 자신의 변경에도 반응해야 파서를 고치다 깨뜨린 것을 잡는다.
  rules:
    - changes:
        - backend/src/main/resources/application*.yaml
        - infra/docker-compose.yml
        - infra/scripts/check-env-contract.py
  script:
    - python3 infra/scripts/check-env-contract.py

infra:ai-keys-verify:
  image: alpine:3.20
  # AI 적재기가 쓰는 외부 API 키 4종이 유효한지 확인한다 (FINCH-179).
  # 적재 코드는 키가 틀려도 그 종목을 건너뛰고 '0건 적재' 로 끝나므로
  # (ai/app/rag/dart.py:121), 키 문제와 데이터 없음이 구분되지 않는다.
  #
  # 외부 API 를 실제로 호출하므로 매 푸시마다 돌리지 않는다. 스크립트가
  # 바뀔 때와 스케줄, 그리고 수동 실행에만 돈다.
  #
  # 키는 Protected 변수라 master 파이프라인에서만 실제 값이 들어온다.
  # 작업 브랜치에서는 스크립트가 '판정 불가' 로 끝난다.
  rules:
    - changes:
        - infra/scripts/verify-ai-keys.sh
        - infra/.gitlab-ci.yml
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl
  script:
    - sh infra/scripts/verify-ai-keys.sh

infra:k8s-chart-lint:
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  # infra/k8s/ 에 CI 검사가 없어서 차트 세 건이 검사 없이 머지됐다 (FINCH-206).
  # helm lint·template 과 셸 문법을 손으로 돌려 확인했는데, 손으로 한 확인은 남지 않는다.
  #
  # FINCH-135 로 Jenkins 배포가 helm 으로 바뀌면 잘못된 차트가 곧 배포 실패가 된다.
  # 그 전에 막아 둔다.
  rules:
    - changes:
        - infra/k8s/**/*
        - infra/.gitlab-ci.yml
  script:
    - |
      set -e
      for c in infra/k8s/charts/*/; do
        echo "── $c ──"
        helm lint "$c"
        # lint 는 값 없이도 통과하는 오류를 놓친다. template 이 실제 렌더까지 돌려
        # 잘못된 함수·들여쓰기·존재하지 않는 값 참조를 잡는다.
        helm template "$(basename "$c")" "$c" > /dev/null
      done
    - |
      set -e
      # k8s 설치 스크립트는 서버에서 root 로 도는 것들이라 문법 오류의 비용이 크다.
      # 셸체크까지는 안 가고 파서 검사만 한다 (의존성 없이 sh 내장으로 된다).
      found=0
      for s in $(find infra/k8s -name '*.sh'); do
        sh -n "$s" && echo "  문법 OK  $s"
        found=$((found + 1))
      done
      # 대상이 0개면 find 경로가 바뀐 것이다. 조용히 통과시키면 검사가 죽은 것을 모른다.
      if [ "$found" -eq 0 ]; then
        echo "✗ 검사한 스크립트가 0개다. find 경로를 확인할 것" >&2
        exit 1
      fi
      echo "▶ 셸 스크립트 $found 개 검사"

infra:k8s-prom-lint:
  image:
    name: prom/prometheus:v3.1.0
    entrypoint: [""]
  rules:
    - changes:
        - infra/k8s/charts/finch-observability/files/prometheus.yml
        - infra/.gitlab-ci.yml
  script:
    - |
      set -e
      SRC=infra/k8s/charts/finch-observability/files/prometheus.yml
      SA="$CI_PROJECT_DIR/.sa"
      OUT="$CI_PROJECT_DIR/.prometheus-lint.yml"

      # promtool 은 authorization.credentials_file 의 존재까지 확인한다. 그 경로는
      # 파드 안에만 있는 서비스어카운트 토큰이라 CI 에는 없고, 없으면 "파일이 없다" 로
      # 실패해서 설정 오류와 구별되지 않는다.
      #
      # 더미를 그 경로에 만들 수는 없다. prom/prometheus 이미지는 nobody(65534)로 돌아
      # /var/run/secrets 에 쓰기 권한이 없다 (CI 에서 실측: Permission denied).
      # 그래서 쓰기 가능한 곳에 더미를 만들고 설정 사본의 경로만 그쪽으로 돌린다.
      mkdir -p "$SA"
      echo dummy > "$SA/token"
      echo dummy > "$SA/ca.crt"
      sed "s#/var/run/secrets/kubernetes.io/serviceaccount#$SA#g" "$SRC" > "$OUT"

      # 치환이 실제로 됐는지 판정한다. 경로가 바뀌어 sed 가 헛돌면 promtool 이
      # "파일 없음" 으로 실패하는데, 그 실패가 설정 오류처럼 보인다.
      if grep -q '/var/run/secrets' "$OUT"; then
        echo "✗ 서비스어카운트 경로 치환에 실패했다. sed 패턴을 확인할 것" >&2
        exit 1
      fi

      # 검사 대상은 경로만 바꾼 사본이다. 나머지 구조와 키는 원본과 같다.
      promtool check config "$OUT"
