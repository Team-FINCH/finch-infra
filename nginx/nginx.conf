# 단일 진입점. / → frontend 정적 파일, /api → backend. (ai 는 내부 전용 — 아래 주석 참고)
# 서버: EC2 finchapp.org. 인증서는 Let's Encrypt (FINCH-19 발급, FINCH-114 적용).
# 웹소켓 업그레이드용: 클라이언트가 Upgrade 헤더를 보냈을 때만 Connection: upgrade 를 전달하고,
# 일반 요청은 빈 값(헤더 미전달)으로 두어 keep-alive 를 깨지 않는다.
server_tokens off;

# .webmanifest 는 nginx:1.27-alpine 의 mime.types 에 항목이 없어 default_type 인
# application/octet-stream 으로 나간다. 스펙 타입은 application/manifest+json 이다 (이슈 #88).
#
# 이 블록은 server 안이 아니라 여기(http 레벨)에 둔다. types 는 같은 레벨에서는 누적되지만
# 다른 레벨에 두면 상위 레벨의 맵을 통째로 대체한다. conf.d/*.conf 는 이미지 nginx.conf 의
# http 블록 안에서 include 되므로, 여기 두면 같은 블록의 include mime.types 와 같은 레벨이
# 되어 한 줄이 더해진다. server 블록에 넣으면 맵이 이 한 줄짜리로 바뀌어 css, js, html 까지
# octet-stream 이 된다 — 문법 오류가 아니라 nginx -t 도 통과한다.
#
# k3s 판(infra/k8s/charts/finch/files/frontend-nginx.conf)과 같은 내용이어야 한다.
types {
    application/manifest+json  webmanifest;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# 80 은 ACME 갱신 요청을 받는 용도로만 남기고 나머지는 443 으로 넘긴다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt 갱신 검증은 반드시 80 으로 들어온다. 이 경로까지 리다이렉트에 태우면
    # 챌린지 파일을 못 읽어 갱신이 영구 실패한다 — 아래 location / 보다 먼저 매칭돼야 한다.
    #
    # `^~` 는 정규식 location 까지 막는다. nginx 는 정규식을 prefix 보다 먼저 보므로,
    # 이 server 에 정규식 location 이 하나라도 생기면 챌린지가 그쪽으로 샌다. 지금은 없지만
    # 갱신은 90일에 한 번 오고 실패해도 그 순간에는 증상이 없어, 두 달 뒤 만료로 드러난다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/finchapp.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finchapp.org/privkey.pem;

    # TLS1.0/1.1 은 브라우저가 이미 거부한다. 남겨두면 취약점 스캔에만 걸린다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    # 헤더 상속 규칙은 infra/README.md '응답 헤더' 절 참고 — location 이 자기 add_header 를
    # 가지면 이 블록을 물려받지 않는다. /assets/ 에 같은 다섯 줄이 반복되는 이유다.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 빌드 산출물은 파일명에 해시가 붙으므로 길게 캐시해도 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 폴백 (react-router)
    #
    # index.html 은 캐시하지 않는다 (FINCH-217).
    #   지시자가 없으면 브라우저가 휴리스틱으로 캐시한다 — 흔한 구현이
    #   (Date - Last-Modified) 의 10% 다. 그 창 안에서는 재검증조차 하지 않는다.
    #   그런데 이 파일이 가리키는 번들은 위에서 30일 immutable 로 못 박아 뒀다.
    #   그래서 배포가 나가도 옛 index.html 을 읽고, 거기 적힌 옛 번들도 캐시에
    #   그대로 있어 **옛 앱이 조용히 계속 돈다.** 오류도 콘솔 흔적도 없다.
    #
    #   창은 파일이 오래될수록 커진다. 3일간 배포가 없으면 7시간가량이 되고,
    #   그 상태에서 배포하면 사용자가 최대 그만큼 옛 앱을 쓴다. 배포가 드물수록 나쁘다.
    #
    #   no-store 가 아니라 no-cache 다. no-cache 는 매번 재검증만 요구하고,
    #   ETag 가 있어 실측하면 304 로 끝난다 — 본문 0바이트다.
    #
    # add_header 를 두는 순간 server 레벨 헤더 상속이 끊긴다. 그래서 보안 헤더
    # 네 줄을 여기에도 다시 적는다 (위 /assets/ 와 같은 이유. 44행 주석 참고).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # upstream 주소를 변수로 두고 Docker 내장 DNS(127.0.0.11)로 요청 시점에 해석한다.
    # 고정 주소로 쓰면 해당 컨테이너가 없을 때 nginx 자체가 기동에 실패한다
    # (없는 서비스로의 요청만 502 가 난다).
    resolver 127.0.0.11 valid=10s;

    # Jenkins — /jenkins 프리픽스 그대로 전달 (Jenkins 가 JENKINS_OPTS --prefix=/jenkins 로 동작).
    # 유효한 인증서가 붙었으므로 GitLab webhook 도 https 로 지정한다 (FINCH-115).
    location /jenkins/ {
        set $jenkins_upstream http://finch-jenkins:8080;
        proxy_pass $jenkins_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Jenkins 웹 UI 의 긴 요청·업로드 대비
        proxy_read_timeout 90s;
        client_max_body_size 50m;
        proxy_hide_header X-Jenkins;
        proxy_hide_header X-Jenkins-Session;
        proxy_hide_header X-Hudson;
        proxy_hide_header X-Hudson-Theme;
    }
    location = /jenkins {
        return 301 /jenkins/;
    }

    # Spring Boot — /api 프리픽스를 그대로 전달한다.
    # (backend 컨트롤러가 /api/** 로 매핑한다는 전제. 아니라면 여기서 프리픽스를 벗긴다)
    #
    # 웹소켓(STOMP, apiSpec §5.6) 대비: Upgrade/Connection 은 hop-by-hop 헤더라
    # 프록시가 명시적으로 넘겨야 핸드셰이크가 성립한다. $http_upgrade 가 비면
    # $connection_upgrade 도 빈 값이 되어 일반 HTTP 요청에는 영향이 없다 (map 참고).
    # read timeout 기본 60초로는 유휴 웹소켓이 끊기므로 넉넉히 늘린다.
    #
    # X-Forwarded-Proto 가 여기서 https 가 되어야 Spring 이 Secure 쿠키를 내려보낸다.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI(ai)는 외부로 노출하지 않는다. 계약상 AI 는 백엔드가 중계하고
    # (apiSpec §10, FE 도 /api 만 호출 — frontend/src/shared/config/apiContract.ts),
    # 직접 노출 시 신뢰 헤더(X-User-Id) 위조 경로가 열린다. 백엔드가 컨테이너
    # 네트워크에서 http://ai:8000 으로 직접 호출하므로 여기 경로가 필요 없다.
}
