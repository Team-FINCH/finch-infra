# 단일 진입점. / → frontend 정적 파일, /api → backend, /ai → ai.
# EC2 + 도메인 확보 후 HTTPS(certbot)는 이 파일에 443 server 블록을 추가해서 얹는다.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 빌드 산출물은 파일명에 해시가 붙으므로 길게 캐시해도 안전하다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 폴백 (react-router)
    location / {
        try_files $uri /index.html;
    }

    # Spring Boot — /api 프리픽스를 그대로 전달한다.
    # (backend 컨트롤러가 /api/** 로 매핑한다는 전제. 아니라면 여기서 프리픽스를 벗긴다)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI — /ai 프리픽스를 벗겨서 전달한다 (proxy_pass 끝의 / 가 그 역할).
    # 예: /ai/v1/report → 컨테이너에는 /v1/report 로 도착.
    # FastAPI 문서(/docs) 링크가 어긋나면 uvicorn 에 --root-path /ai 를 추가할 것.
    location /ai/ {
        proxy_pass http://ai:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 리포트 생성처럼 오래 걸리는 요청 대비
        proxy_read_timeout 120s;
    }
}
