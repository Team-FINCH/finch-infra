# 시세 캐시, 세션. Service 이름 "redis" 는 backend/application.yaml 계약(REDIS_HOST=redis).
# 캐시 용도라 유실 허용 — 볼륨 없는 Deployment 로 충분하다 (StatefulSet 불필요).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: finch
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: finch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          env:
            - name: TZ
              value: Asia/Seoul
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
