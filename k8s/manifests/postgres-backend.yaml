# backend 원장 DB. Service 이름 "postgres" 는 backend/application.yaml 의 접속 계약
# (POSTGRES_HOST=postgres)을 따른 것이다 — 임의로 바꾸면 backend 가 못 붙는다.
# StatefulSet 인 이유: DB 는 저장소와 정체성이 붙어 다녀야 한다. Deployment 로 두면
# 재스케줄 시 볼륨 연결이 보장되지 않는다. 시크릿 postgres-secret 은 커밋하지 않고
# kubectl create secret 으로 만든다 (README 순서 2).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: finch
spec:
  clusterIP: None
  selector:
    app: postgres-backend
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-backend
  namespace: finch
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres-backend
  template:
    metadata:
      labels:
        app: postgres-backend
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: TZ
              value: Asia/Seoul
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
