# frontend — 정적 파일 서빙. k8s 에서 /api 라우팅과 TLS 종단은 Ingress 가 맡으므로
# 이미지의 conf 를 ConfigMap 으로 덮는다. 이유와 빠지는 항목은 files/frontend-nginx.conf 참고.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
data:
  default.conf: |
{{ .Files.Get "files/frontend-nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # conf 가 바뀌면 파드를 다시 만든다. ConfigMap 만 갱신하면 마운트된 파일은
        # 바뀌어도 nginx 가 다시 읽지 않아 옛 설정으로 계속 돈다.
        checksum/nginx-conf: {{ .Files.Get "files/frontend-nginx.conf" | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: Asia/Seoul
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
