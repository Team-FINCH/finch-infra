# 단일 진입점 — compose 의 nginx.conf 라우팅을 Ingress 리소스로 옮긴 것.
# ai 는 내부 전용이라 여기 없다 (FINCH-99 와 같은 원칙).
# 웹소켓(STOMP): proxy-read-timeout 상향은 유휴 연결이 60초에 끊기는 것을 막는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finch
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
