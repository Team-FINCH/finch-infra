# backend — 원장의 단일 진실 공급원.
# replicas 2 + maxUnavailable 0: 새 Pod 가 Ready(readinessProbe 통과) 되기 전에는
# 기존 Pod 를 내리지 않는다. 무중단 배포의 실체가 이 세 줄이다.
# 접속 계약은 backend/src/main/resources/application.yaml 이 정의한다
# (postgres-secret 주입, Service 이름 postgres/redis 가 호스트).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          # 레지스트리 없이 k3s ctr images import 로 반입하므로 외부 pull 을 시도하면 안 된다
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: backend-secret
          env:
            - name: TZ
              value: Asia/Seoul
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            # 비밀이 아닌 값 넷은 여기서 env 로 렌더된다. 비밀값과 달리 secretRef 를 거치지
            # 않으므로, values 에서 빠져도 "환경변수가 없는" 상태가 되지 않는다 — `nil | quote`
            # 가 렌더를 통과시켜 `value:` 가 비고, Kubernetes 는 빈 value 를 미설정이 아니라
            # **빈 문자열**로 세팅한다. 그러면 Spring 플레이스홀더가 `""` 로 정상 해결돼
            # 기동이 성공하고, 첫 요청에서야 터진다. application.yaml 의 기본값을 지우는
            # 방식으로는 막히지 않는 경로다 (빈 문자열도 값이므로 기본값이 발동하지 않는다).
            #
            # required 는 null 과 빈 문자열을 모두 렌더 단계에서 막는다. compose 가 비밀값에
            # `:?` 를 쓰는 것과 같은 성질이다 (이슈 #44, FINCH-336).
            - name: SPRING_PROFILES_ACTIVE
              value: {{ required "backend.profile 이 필요합니다" .Values.backend.profile | quote }}
            - name: FINCH_PUBLIC_BASE_URL
              value: {{ required "publicBaseUrl 이 필요합니다" .Values.publicBaseUrl | quote }}
            - name: FINCH_FRONT_BASE_URL
              value: {{ required "frontBaseUrl 이 필요합니다" .Values.frontBaseUrl | quote }}
            - name: FINCH_AI_BASE_URL
              value: {{ required "aiBaseUrl 이 필요합니다" .Values.aiBaseUrl | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # readiness: 트래픽을 받아도 되는가 (실패 시 Service 에서 제외만)
          # liveness: 프로세스가 살아 있는가 (실패 시 재시작) — 관대하게, readiness 는 민감하게
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
