# ai — 내부 전용 (Ingress 에 노출하지 않는다. backend 가 http://ai:8000 으로 중계).
# APP_ENV=prod 를 차트에서 고정하는 이유는 compose 와 동일하다: 시크릿(ai-env)이
# 누락돼도 내부 토큰 검증이 fail-closed 로 닫히게 (Jira FINCH-99).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: {{ .Values.ai.replicas }}
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-env
                optional: true
          env:
            - name: TZ
              value: Asia/Seoul
            - name: APP_ENV
              value: prod
            - name: BACKEND_BASE_URL
              value: http://backend:8080
            # DATABASE_URL 은 compose 와 같은 방식으로 여기서 조립한다.
            # ai.env 에도 같은 이름이 있지만 그 값은 로컬 개발용(localhost)이고,
            # compose 는 environment: 로 덮어쓴다. envFrom 만 쓰면 그 localhost 가
            # 그대로 들어와 파드가 DB 를 못 찾는다 — env 가 envFrom 을 덮으므로 여기 둔다.
            #
            # $(VAR) 확장은 같은 env 목록에 앞서 정의된 이름만 참조한다 (envFrom 은 안 된다).
            # 그래서 세 조각을 먼저 secretKeyRef 로 꺼낸 뒤 조립한다.
            - name: AI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-ai-secret
                  key: POSTGRES_USER
            - name: AI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ai-secret
                  key: POSTGRES_PASSWORD
            - name: AI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-ai-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(AI_DB_USER):$(AI_DB_PASSWORD)@postgres-ai:5432/$(AI_DB_NAME)"
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  selector:
    app: ai
  ports:
    - port: 8000
