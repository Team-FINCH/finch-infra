# ai — 내부 전용 (Ingress 에 노출하지 않는다. backend 가 http://ai:8000 으로 중계).
# APP_ENV=prod 를 차트에서 고정하는 이유는 compose 와 동일하다: 시크릿(ai-env)이
# 누락돼도 내부 토큰 검증이 fail-closed 로 닫히게 (Jira FINCH-99).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: {{ .Values.ai.replicas }}
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-env
                optional: true
          env:
            - name: TZ
              value: Asia/Seoul
            - name: APP_ENV
              value: prod
            - name: BACKEND_BASE_URL
              value: http://backend:8080
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  selector:
    app: ai
  ports:
    - port: 8000
