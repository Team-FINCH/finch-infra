# k3s 전용 frontend conf. ConfigMap 으로 이미지의 default.conf 를 덮는다.
#
# 이미지는 compose 와 같은 것을 쓴다. 그래서 이미지를 고치는 대신 여기서 덮는다 —
# 이미지의 conf 는 443 을 종단하고 /etc/letsencrypt 를 읽는데, 클러스터에는 그 경로가
# 없어서 nginx 가 기동 자체를 못 한다(cannot load certificate). compose 는 호스트
# 인증서를 마운트하므로 그대로 두어야 한다.
#
# k8s 에서 없어지는 것과 그 이유
#   TLS 종단      ingress-nginx 가 맡는다 (FINCH-133)
#   /api/ 프록시  Ingress 규칙이 기본 경로지만, Cloudflare Tunnel이 frontend Service를
#                 직접 origin으로 쓰는 경우에도 같은 오리진 API가 깨지지 않도록 유지한다
#   /jenkins/     Jenkins 는 클러스터 밖(compose)에 남는다 (FINCH-39)
#   resolver      127.0.0.11 은 Docker 내장 DNS 다. 클러스터에는 없다
#   HSTS          TLS 를 종단하는 쪽이 넣어야 의미가 있다. Ingress 로 옮긴다
#
# Cloudflare가 붙인 원래 scheme을 보존하고, 없으면 현재 연결 scheme을 쓴다.
map $http_x_forwarded_proto $finch_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $finch_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 정상 진입점은 ingress-nginx의 /api 규칙이다. 다만 remotely-managed Cloudflare
    # Tunnel이 frontend Service를 origin으로 지정해도 API POST와 WebSocket이 정적
    # 파일 location으로 떨어지지 않도록 같은 경로를 여기서도 백엔드로 보낸다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $finch_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $finch_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite 산출물은 파일명에 해시가 붙어 길게 캐시해도 안전하다.
    # location 이 자기 add_header 를 가지면 위 블록을 물려받지 않으므로 세 줄을 다시 적는다
    # (nginx add_header 비상속 — infra/README.md '응답 헤더' 절).
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # readinessProbe 가 여기로 온다. 정적 파일이 없으면 실패해야 하므로 폴백에 기대지 않는다.
    #
    # 타입은 add_header 가 아니라 default_type 으로 준다. `return 200 "본문"` 은 그 시점에
    # 이미 default_type 값으로 Content-Type 을 세우므로, add_header 를 쓰면 한 줄이 덧붙어
    # 응답에 Content-Type 이 둘 나간다. 프로브는 상태 코드만 보므로 증상이 없었다.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 폴백 (react-router)
    #
    # index.html 은 캐시하지 않는다 (FINCH-217, 227).
    #   지시자가 없으면 브라우저가 휴리스틱으로 캐시한다. 그런데 이 파일이 가리키는
    #   번들은 위에서 30일 immutable 로 못 박아 뒀다. 그래서 배포가 나가도 옛
    #   index.html 을 읽고, 거기 적힌 옛 번들도 캐시에 그대로 있어 **옛 앱이
    #   조용히 계속 돈다.** 오류도 콘솔 흔적도 없다.
    #
    # **compose 판(infra/nginx/conf)과 같은 값이어야 한다.** 설정이 두 벌이라
    # 한쪽만 고치면 커트오버 순간에 수정이 사라진다 — 실제로 MR !200 에서
    # compose 쪽만 고쳤고 커트오버 대조에서 잡혔다 (FINCH-227).
    #
    # add_header 를 두면 server 레벨 상속이 끊긴다. 보안 헤더 세 줄을 다시 적는다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
