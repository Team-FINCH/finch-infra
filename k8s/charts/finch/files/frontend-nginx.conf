# k3s 전용 frontend conf. ConfigMap 으로 이미지의 default.conf 를 덮는다.
#
# 이미지는 compose 와 같은 것을 쓴다. 그래서 이미지를 고치는 대신 여기서 덮는다 —
# 이미지의 conf 는 443 을 종단하고 /etc/letsencrypt 를 읽는데, 클러스터에는 그 경로가
# 없어서 nginx 가 기동 자체를 못 한다(cannot load certificate). compose 는 호스트
# 인증서를 마운트하므로 그대로 두어야 한다.
#
# k8s 에서 없어지는 것과 그 이유
#   TLS 종단      ingress-nginx 가 맡는다 (FINCH-133)
#   /api/ 프록시  Ingress 규칙이 backend Service 로 직접 보낸다
#   /jenkins/     Jenkins 는 클러스터 밖(compose)에 남는다 (FINCH-39)
#   resolver      127.0.0.11 은 Docker 내장 DNS 다. 클러스터에는 없다
#   HSTS          TLS 를 종단하는 쪽이 넣어야 의미가 있다. Ingress 로 옮긴다
#
# 그래서 이 파일이 하는 일은 정적 파일 서빙과 SPA 폴백뿐이다.

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 산출물은 파일명에 해시가 붙어 길게 캐시해도 안전하다.
    # location 이 자기 add_header 를 가지면 위 블록을 물려받지 않으므로 세 줄을 다시 적는다
    # (nginx add_header 비상속 — infra/README.md '응답 헤더' 절).
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # readinessProbe 가 여기로 온다. 정적 파일이 없으면 실패해야 하므로 폴백에 기대지 않는다.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 폴백 (react-router)
    location / {
        try_files $uri /index.html;
    }
}
