# 앱 계층 기본값. CI 는 이미지 태그만 --set 으로 주입한다:
#   helm upgrade --install finch . -n finch --atomic --set backend.image.tag=<커밋해시>
# 리소스 값은 compose 의 mem_limit 과 같은 근거의 보수적 초기값 — 실측 후 조정 (Jira FINCH-59).

# 비밀이 아닌 외부 주소와 프로파일. 비밀값과 갈라 두는 기준은 infra/README.md 참고 —
# 비밀은 Secret(클러스터에만 만든다), 비밀 아닌 것은 여기(git 에 남아 리뷰를 받는다).
publicBaseUrl: https://finchapp.org
frontBaseUrl: https://finchapp.org
# compose 서비스 이름이 아니라 k8s Service 이름이다. 두 이름이 같아서 값이 같아 보이지만
# 근거가 다르다 — 서비스 이름을 바꾸면 여기도 바꿔야 한다.
aiBaseUrl: http://ai:8000

backend:
  # prod 는 세 가지를 바꾼다 (application.yaml 의 on-profile: prod 절)
  #   로그를 ECS JSON 으로, finch.price.provider 를 kis 로, seed-on-empty 를 false 로
  profile: prod
  image:
    repository: finch/backend
    # latest 는 imagePullPolicy 기본값을 Always 로 만들어 레지스트리 없는 반입 방식과 충돌한다.
    # CI 가 커밋 해시로 덮어쓰는 것을 전제로 한 자리 표시자다.
    tag: latest
  replicas: 2
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 1536Mi

ai:
  image:
    repository: finch/ai
    tag: latest
  replicas: 1
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

frontend:
  image:
    repository: finch/nginx
    tag: latest
  replicas: 1
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi

ingress:
  className: nginx
  # 도메인 확보 전이라 host 미지정(모든 호스트 수신). 확보 후 값 지정 + TLS 추가.
  host: ""
