# Grafana 데이터소스를 파일로 선언한다.
# UI 로 추가하면 그 설정이 grafana 볼륨에만 남아, 볼륨을 잃으면 손으로 다시 만들어야
# 한다. 여기 두면 파드를 새로 만들어도 항상 같은 상태로 뜬다 (FINCH-112 의
# "재생성 가능한 것은 백업하지 않는다" 원칙과 짝이다 — 백업 대신 코드로 복원한다).
#
# url 이 compose 판과 같아 보이지만 근거가 다르다. compose 에서는 compose 서비스
# 이름이었고 여기서는 k8s Service 이름이다. 같은 네임스페이스라 짧은 이름으로 풀린다.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # prometheus.yml 의 scrape_interval 과 맞춘다. 어긋나면 그래프에 없는 구간이
      # 데이터 없음으로 보이거나 계단처럼 끊긴다.
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 로그 본문에서 요청 ID 를 찾아 클릭하면 같은 요청의 다른 로그로 이동한다.
      # X-Request-Id 는 apiSpec 이 정한 요청 식별자이며, 백엔드와 AI 로그를
      # 한 요청 기준으로 잇는 유일한 끈이다 (분산 추적을 도입하지 않기로 한 대신의 수단).
      derivedFields:
        - name: RequestId
          matcherRegex: '[Xx]-[Rr]equest-[Ii]d[=:"\s]+([0-9a-fA-F-]{8,})'
          url: '$${__value.raw}'
          datasourceUid: loki

  # AI 토큰 사용량. AI 가 요청마다 ai_responses 에, 정산마다 ai_token_daily 에
  # 토큰을 남기므로 지표를 따로 내보내지 않고 그 테이블을 읽는다 — 재시작해도
  # 카운터가 0 이 되지 않고, 청구와 대조할 숫자가 그대로 있다.
  # 접속 정보는 grafana-ai-db Secret 에서 환경변수로 온다 (README "AI 토큰 대시보드").
  # 계정은 두 테이블 SELECT 만 가진 읽기 전용 역할이다.
  - name: AI DB
    type: grafana-postgresql-datasource
    uid: ai-db
    access: proxy
    url: postgres-ai.finch.svc.cluster.local:5432
    user: $AI_DB_GRAFANA_USER
    jsonData:
      database: $AI_DB_GRAFANA_DATABASE
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $AI_DB_GRAFANA_PASSWORD
