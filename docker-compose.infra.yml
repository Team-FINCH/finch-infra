# CI/CD 인프라: Jenkins(CD) + gitlab-runner(CI)
# 앱 스택과 수명 주기를 분리한다 — 앱 재배포가 Jenkins 를 건드리지 않도록.
# 실행: cd infra && docker compose -f docker-compose.infra.yml up -d --build
name: finch-infra

# 컨테이너 로그 상한. 기본(json-file)은 무제한이라 장기 운영 시 디스크를 먹는다.
# 서비스마다 logging: *default-logging 으로 참조한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build:
      context: ..
      dockerfile: infra/docker/jenkins.Dockerfile
    image: finch/jenkins:latest
    container_name: finch-jenkins
    # docker.sock 접근을 위해 root 로 실행한다.
    # 보안상 이상적이진 않지만 단일 VM 교육 프로젝트에서는 실용적 선택 (결정서 참고).
    user: root
    # 접근은 nginx(80) 경유 http://<공인IP>/jenkins/ 가 기본이다.
    # github.com 이 443 대상 webhook 에 https 를 강제해 443 직접 노출로는 webhook 이 불가능했고,
    # ACG 실측상 열린 포트가 22·80·443 뿐이라 nginx 경유로 전환했다 (443 직접 접속도 백업으로 유지).
    # EC2 이전 시: 보안그룹에 8080 을 열면 prefix 없이 직접 노출로 되돌릴 수 있다.
    ports:
      - "443:8080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JENKINS_OPTS: "--prefix=/jenkins"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    restart: unless-stopped
    networks:
      - default
      - app   # nginx 가 /jenkins 를 프록시할 수 있도록 앱 네트워크에도 연결

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: finch-gitlab-runner
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    restart: unless-stopped
    # 최초 1회 등록 (토큰: GitLab 프로젝트 Settings → CI/CD → Runners):
    #   docker exec -it finch-gitlab-runner gitlab-runner register \
    #     --url https://github.com \
    #     --executor docker --docker-image alpine:latest \
    #     --docker-volumes /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
  gitlab_runner_config:

networks:
  # 앱 스택(docker-compose.yml, 프로젝트명 finch)이 만드는 기본 네트워크에 합류한다.
  # 앱 스택이 먼저 떠 있어야 이 네트워크가 존재한다.
  app:
    external: true
    name: finch_default
