# CI/CD 인프라: Jenkins(CD) + gitlab-runner(CI)
# 앱 스택과 수명 주기를 분리한다 — 앱 재배포가 Jenkins 를 건드리지 않도록.
# 실행: cd infra && docker compose -f docker-compose.infra.yml up -d --build
name: finch-infra

# 컨테이너 로그 상한. 기본(json-file)은 무제한이라 장기 운영 시 디스크를 먹는다.
# 서비스마다 logging: *default-logging 으로 참조한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build:
      context: ..
      dockerfile: infra/docker/jenkins.Dockerfile
    image: finch/jenkins:latest
    container_name: finch-jenkins
    mem_limit: 2048m
    # docker.sock 접근을 위해 root 로 실행한다.
    # 보안상 이상적이진 않지만 단일 VM 교육 프로젝트에서는 실용적 선택 (결정서 참고).
    user: root
    # 접근은 nginx(80) 경유 http://finchapp.org/jenkins/ 로만 한다 — 호스트 포트를 열지 않는다.
    #  - github.com 이 443 대상 webhook 에 https 를 강제해 443 직접 노출로는 webhook 이 불가능했다.
    #  - EC2 에서는 443 을 nginx HTTPS(certbot) 에 써야 하므로 NCP 시절의 "443:8080" 백업 노출을 제거했다.
    #  - EC2 공지: 8080 같은 솔루션 기본 포트를 외부에 그대로 열지 말 것 → 아예 publish 하지 않는다.
    # nginx 가 죽어 Jenkins 에 직접 붙어야 하면 임시로 ports: ["127.0.0.1:18080:8080"] 을 켜고
    # ssh -i finchT.pem -L 18080:127.0.0.1:18080 ubuntu@finchapp.org 로 터널링한다 (ufw 개방 불필요).
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JENKINS_OPTS: "--prefix=/jenkins"
      # k3s 가 만든 kubeconfig 의 server 는 https://127.0.0.1:6443 인데, 컨테이너 안에서
      # 127.0.0.1 은 컨테이너 자신이다. 파일을 고쳐 쓰는 대신 주소만 바꿔 부른다 —
      # API 서버 인증서 SAN 에 노드 IP 가 들어 있어(실측) TLS 검증이 그대로 통과한다.
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      KUBE_APISERVER: ${KUBE_APISERVER:?infra/.env 에 KUBE_APISERVER 가 필요합니다}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # cron 이 실행하는 운영 스크립트를 배포가 갱신한다 (FINCH-204).
      #
      # cron 4건이 ${APP_DIR}/infra/scripts/ 의 스크립트를 돌리는데(setup-server.sh 가 등록),
      # 그 디렉터리를 최신으로 유지하는 장치가 없었다. Jenkins 는 자기 워크스페이스에서
      # 배포하므로 앱은 최신인데 cron 스크립트는 어떤 배포 경로에도 들어 있지 않았다.
      # 실제로 renew-cert.sh 가 두 달 뒤에 터질 상태로 방치돼 있었다.
      - ${OPS_DIR:-/srv/FINCH}/infra:/opt/ops
      # FINCH-135 로 배포 스테이지가 helm 을 부를 때 필요한 kubeconfig.
      # 크리덴셜이 아니라 마운트인 이유는 docker.sock 과 같다 — Jenkins 는 이미 그
      # 소켓으로 호스트 root 와 같은 일을 할 수 있어서, 이 파일만 따로 감춘다고
      # 새로 생기는 경계가 없다. 읽기 전용으로 건다.
      - /etc/rancher/k3s/k3s.yaml:/etc/rancher/k3s/k3s.yaml:ro
    logging: *default-logging
    restart: unless-stopped
    networks:
      - default
      - app   # nginx 가 /jenkins 를 프록시할 수 있도록 앱 네트워크에도 연결

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: finch-gitlab-runner
    mem_limit: 512m
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    restart: unless-stopped
    # 최초 1회 등록 (토큰: GitLab 프로젝트 Settings → CI/CD → Runners):
    #   docker exec -it finch-gitlab-runner gitlab-runner register \
    #     --url https://github.com \
    #     --executor docker --docker-image alpine:latest \
    #     --docker-volumes /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
  gitlab_runner_config:

networks:
  # 앱 스택(docker-compose.yml, 프로젝트명 finch)이 만드는 기본 네트워크에 합류한다.
  # 앱 스택이 먼저 떠 있어야 이 네트워크가 존재한다.
  app:
    external: true
    name: finch_default
